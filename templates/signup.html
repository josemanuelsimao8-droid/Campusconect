<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='stylelogin.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='stylesignup.css') }}"
    />
    <title>Criar conta | Student Portal</title>
  </head>
  <body>
    <main class="login-page">
      <section class="login-side signup-side" aria-labelledby="signup-title">
        <div class="signup-content">
          <h1 id="signup-title">Criar conta</h1>
          <p class="signup-intro">Preencha seus dados acadêmicos</p>

          <form
            class="register-form"
            action="{{ url_for('views.signup') }}"
            method="post"
          >
            <div class="register-grid">
              <div class="register-field register-field--wide">
                <label for="full-name">Nome completo</label>
                <input
                  id="full-name"
                  name="full_name"
                  type="text"
                  autocomplete="name"
                  required
                />
              </div>
              <div class="register-field">
                <label for="student-number">Número de estudante</label>
                <input
                  id="student-number"
                  name="student_number"
                  type="text"
                  autocomplete="off"
                  required
                />
              </div>
              <div class="register-field register-field--wide university-field">
                <label for="university-search">Universidade</label>

                <div class="university-select">
                  <input
                    id="university-search"
                    type="text"
                    placeholder="Pesquisar universidade ou sigla..."
                    autocomplete="off"
                    required
                  />

                  <input id="university" name="university_id" type="hidden" />

                  <div id="university-options" class="university-options">
                    {% for university in universities %}

                    <button
                      type="button"
                      class="university-option"
                      data-id="{{ university.id }}"
                      data-name="{{ university.name }}"
                      data-acronym="{{ university.acronym }}"
                    >
                      <span class="university-name">
                        {{ university.name }}
                      </span>

                      <span class="university-acronym">
                        {{ university.acronym }}
                      </span>
                    </button>

                    {% endfor %}
                  </div>
                </div>
              </div>
              <div class="register-field register-field--wide">
                <label for="campus">Polo / Campus</label>

                <select id="campus" name="campus_id" required disabled>
                  <option value="">Selecione primeiro a universidade</option>
                </select>
              </div>
              <div class="register-field">
                <label for="email">E-mail</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="register-field">
                <label for="phone">Telefone</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  autocomplete="tel"
                  required
                />
              </div>
              <div class="register-field">
                <label for="location">Localização</label>
                <input
                  id="location"
                  name="location"
                  type="text"
                  placeholder="Cidade, país"
                  autocomplete="address-level2"
                  required
                />
              </div>
              <div class="register-field">
                <label for="course">Curso</label>

                <select id="course" name="course_offering_id" required disabled>
                  <option value="">Selecione primeiro o polo</option>
                </select>
              </div>

              <div class="register-field">
                <label for="academic-year">Ano académico</label>

                <select id="academic-year" name="academic_year" required>
                  <option value="">Selecione</option>
                  <option value="1">1.º ano</option>
                  <option value="2">2.º ano</option>
                  <option value="3">3.º ano</option>
                  <option value="4">4.º ano</option>
                  <option value="5">5.º ano</option>
                  <option value="6">6.º ano</option>
                </select>
              </div>
              <div class="register-field">
                <label for="password">Senha</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
              </div>
              <div class="register-field">
                <label for="confirm-password">Confirmar senha</label>
                <input
                  id="confirm-password"
                  name="confirm_password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
              </div>
            </div>

            <label class="register-consent">
              <input name="information_confirmed" type="checkbox" required />
              <span
                >Confirmo que as informações fornecidas são verdadeiras.</span
              >
            </label>

            {% if signup_notice %}
            <p class="signup-notice" role="status">{{ signup_notice }}</p>
            {% endif %}

            <button class="submit" type="submit">Criar conta</button>
          </form>

          <p class="signup-return">
            Já tem uma conta? <a href="{{ url_for('views.login') }}">Entrar</a>
          </p>
        </div>
      </section>

      <section class="welcome-side" aria-labelledby="welcome-title">
        <div class="welcome-card">
          <div class="welcome-copy">
            <h2 id="welcome-title">
              <strong>Welcome to</strong><span>student portal</span>
            </h2>
            <p>Comece sua jornada acadêmica</p>
          </div>
          <div class="artwork">
            <img
              src="{{ url_for('static', filename='img/logotipo.png') }}"
              alt="Estudantes e materiais acadêmicos"
            />
          </div>
        </div>
      </section>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const universitySearch = document.getElementById("university-search");
        const universityId = document.getElementById("university");
        const universityOptions = document.getElementById("university-options");
        const universityButtons =
          document.querySelectorAll(".university-option");
        const campusSelect = document.getElementById("campus");
        const courseSelect = document.getElementById("course");

        // Abrir a lista quando o campo recebe foco
        universitySearch.addEventListener("focus", () => {
          universityOptions.classList.add("active");
          filterUniversities();
        });

        // Pesquisar universidades
        universitySearch.addEventListener("input", () => {
          universityId.value = "";

          campusSelect.innerHTML =
            '<option value="">Selecione primeiro a universidade</option>';

          campusSelect.disabled = true;
          resetCourse("Selecione primeiro o polo");

          universityOptions.classList.add("active");

          filterUniversities();
        });

        function filterUniversities() {
          const search = universitySearch.value.toLowerCase().trim();

          let visible = 0;

          universityButtons.forEach((button) => {
            const name = button.dataset.name.toLowerCase();
            const acronym = button.dataset.acronym.toLowerCase();

            const matches = name.includes(search) || acronym.includes(search);

            if (matches) {
              button.style.display = "flex";
              visible++;
            } else {
              button.style.display = "none";
            }
          });

          if (visible === 0) {
            universityOptions.classList.add("empty");
          } else {
            universityOptions.classList.remove("empty");
          }
        }

        // Selecionar universidade
        universityButtons.forEach((button) => {
          button.addEventListener("click", async () => {
            const id = button.dataset.id;
            const name = button.dataset.name;

            universitySearch.value = name;
            universityId.value = id;
            resetCourse("Selecione primeiro o polo");

            universityOptions.classList.remove("active");

            await loadCampuses(id);
          });
        });

        // Carregar polos/campi da universidade
        async function loadCampuses(universityIdValue) {
          campusSelect.disabled = true;

          campusSelect.innerHTML =
            '<option value="">A carregar polos...</option>';

          try {
            const response = await fetch(
              `/api/universities/${universityIdValue}/campuses`,
            );

            if (!response.ok) {
              throw new Error("Erro ao carregar polos.");
            }

            const campuses = await response.json();

            campusSelect.innerHTML =
              '<option value="">Selecione o polo/campus</option>';

            if (campuses.length === 0) {
              campusSelect.innerHTML =
                '<option value="">Nenhum polo cadastrado</option>';

              campusSelect.disabled = true;
              return;
            }

            campuses.forEach((campus) => {
              const option = document.createElement("option");

              option.value = campus.id;

              option.textContent = campus.district
                ? `${campus.name} — ${campus.district}`
                : campus.name;

              campusSelect.appendChild(option);
            });

            campusSelect.disabled = false;
          } catch (error) {
            console.error(error);

            campusSelect.innerHTML =
              '<option value="">Erro ao carregar polos</option>';

            campusSelect.disabled = true;
          }
        }

        campusSelect.addEventListener("change", () => {
          if (!campusSelect.value) {
            resetCourse("Selecione primeiro o polo");
            return;
          }

          loadCourses(campusSelect.value);
        });

        function resetCourse(message) {
          courseSelect.innerHTML = `<option value="">${message}</option>`;
          courseSelect.disabled = true;
        }

        async function loadCourses(campusId) {
          courseSelect.disabled = true;
          courseSelect.innerHTML =
            '<option value="">A carregar cursos...</option>';

          try {
            const response = await fetch(`/api/campuses/${campusId}/courses`);

            if (!response.ok) {
              throw new Error("Erro ao carregar cursos.");
            }

            const courses = await response.json();

            courseSelect.innerHTML =
              '<option value="">Selecione o curso</option>';

            if (courses.length === 0) {
              resetCourse("Nenhum curso cadastrado");
              return;
            }

            courses.forEach((course) => {
              const option = document.createElement("option");
              option.value = course.id;
              option.textContent = `${course.name} — ${course.education_level}`;
              courseSelect.appendChild(option);
            });

            courseSelect.disabled = false;
          } catch (error) {
            console.error(error);
            resetCourse("Erro ao carregar cursos");
          }
        }

        // Fechar lista ao clicar fora
        document.addEventListener("click", (event) => {
          if (!event.target.closest(".university-select")) {
            universityOptions.classList.remove("active");
          }
        });
      });
    </script>
  </body>
</html>
