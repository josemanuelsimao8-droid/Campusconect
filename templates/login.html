<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='stylelogin.css') }}">
  <title>Login | Student Portal</title>
</head>
<body>
  <main class="login-page">
    <section class="login-side" aria-labelledby="login-title">
      <div class="login-content">
        <h1 id="login-title">Login</h1>
        <p class="login-intro">Enter your account details</p>
        <form class="login-form">
          <label class="visually-hidden" for="username">Username</label>
          <input id="username" type="text" placeholder="Username" autocomplete="username" required>

          <div class="password-field">
            <label class="visually-hidden" for="password">Password</label>
                        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.7a2 2 0 002.7 2.7M9.9 5.2A10.8 10.8 0 0112 5c5 0 8.5 4.2 9.5 6-.4.8-1.4 2.2-3 3.5M6.2 6.2C4.2 7.4 2.9 9.4 2.5 11c.5 1 4 6 9.5 6 1 0 2-.2 2.9-.5"/></svg>
            </button>
          </div>

          <a class="forgot-link" href="#forgot-password">Forgot Password?</a>
          <button class="submit" type="submit">Login</button>
        </form>
      </div>

      <div class="signup-prompt">
        <span>Don't have an account?</span>
        <a href="{{ url_for('views.signup') }}">Sign up</a>
      </div>
    </section>

    <section class="welcome-side" aria-labelledby="welcome-title">
      <div class="welcome-card">
        <div class="welcome-copy">
          <h2 id="welcome-title"><strong>Welcome to</strong><span>student portal</span></h2>
          <p>Login to access your account</p>
        </div>
        <div class="artwork">
          <img src="{{ url_for('static', filename='img/logotipo.png') }}" alt="Estudantes e materiais acadêmicos" />
        </div>
      </div>
    </section>
    </main>
  <script>
    const passwordInput = document.querySelector('#password');
    const passwordToggle = document.querySelector('.password-toggle');

    passwordToggle.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      passwordToggle.setAttribute('aria-pressed', String(!isVisible));
      passwordToggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
    });
  </script>
</body>
</html>
